<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neil Denby - Health & Wellness</title>
<style>
@page { size: 90mm 55mm; margin: 0; }
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: #fff;
  font-family: Arial, Helvetica, sans-serif;
  color: #000;
}
.card {
  width: 90mm;
  height: 55mm;
  margin: 10mm auto;
  padding: 5mm;
  display: grid;
  grid-template-columns: 14mm 1fr 22mm;
  grid-template-rows: 1fr auto;
  gap: 0 3mm;
  background: #fff;
  border: 1px solid #000;
}
.tick-area {
  text-align: center;
  padding-top: 1mm;
}
.tick-box {
  width: 10mm;
  height: 10mm;
  margin: 0 auto 2mm;
  border: 1.2px solid #000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19pt;
  font-weight: 800;
  line-height: 1;
}
.one-tick {
  font-size: 6.8pt;
  font-weight: 800;
}
.main {
  min-width: 0;
}
.name {
  font-size: 14.5pt;
  font-weight: 800;
  margin: 0;
}
.role {
  margin-top: 1.2mm;
  font-size: 7.8pt;
  font-weight: 800;
}
.electorate {
  margin-top: 1.4mm;
  font-size: 9.2pt;
  font-weight: 800;
}
.rule {
  margin: 1.5mm 0 1.8mm;
  border-top: .7px solid #000;
  width: 100%;
}
.focus {
  font-size: 10.5pt;
  font-weight: 800;
}
.contact {
  margin-top: 1.4mm;
  font-size: 7.4pt;
  line-height: 1.5;
}
.tagline {
  margin-top: 1.6mm;
  font-size: 7.2pt;
  font-weight: 800;
}
.qr {
  text-align: center;
  align-self: center;
}
.qr img {
  width: 20mm;
  height: 20mm;
  display: block;
  margin: 0 auto;
}
.qr-label {
  margin-top: 1mm;
  font-size: 5.5pt;
  font-weight: 800;
}
.footer {
  grid-column: 1 / -1;
  border-top: .5px solid #000;
  padding-top: 1.5mm;
  text-align: center;
  font-size: 6.4pt;
  font-weight: 800;
}
@media print {
  .card {
    margin: 0;
  }
}
</style>
</head>
