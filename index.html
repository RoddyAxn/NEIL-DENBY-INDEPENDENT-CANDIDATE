<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neil Denby — One Tick Independent</title>
<style>
  @page { size: 90mm 55mm; margin: 0; }
  html, body {
    margin: 0;
    padding: 0;
    background: #f2f2f2;
    font-family: Arial, Helvetica, sans-serif;
  }
  .card {
    width: 90mm;
    height: 55mm;
    box-sizing: border-box;
    background: #fff;
    display: grid;
    grid-template-columns: 20mm 1fr;
    align-items: center;
    padding: 5mm;
    margin: 10mm auto;
  }
  .tick-panel {
    text-align: center;
    font-weight: 700;
  }
  .tick {
    font-size: 38pt;
    line-height: 0.9;
  }
  .one-tick {
    margin-top: 2mm;
    font-size: 9pt;
    line-height: 1.05;
  }
  .details {
    padding-left: 3mm;
  }
  .name {
    font-size: 16pt;
    font-weight: 700;
    margin: 0 0 1mm 0;
  }
  .role {
    font-size: 9pt;
    font-weight: 700;
    margin: 0 0 2mm 0;
  }
  .electorate {
    font-size: 10pt;
    font-weight: 700;
    margin: 0 0 1mm 0;
  }
  .line {
    font-size: 8pt;
    margin: 0.4mm 0;
  }
  .tagline {
    font-size: 8.5pt;
    font-weight: 700;
    margin-top: 2mm;
  }
  @media print {
    html, body { background: #fff; }
    .card { margin: 0; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="tick-panel">
      <div class="tick">✓</div>
      <div class="one-tick">ONE<br>TICK</div>
    </div>
    <div class="details">
      <div class="name">NEIL DENBY</div>
      <div class="role">INDEPENDENT CANDIDATE</div>
      <div class="electorate">HAURAKI–WAIKATO</div>
      <div class="line">TE-IKA-A-MAUI (NATIVE)</div>
      <div class="line">TE-MOANA-NUI-A-KIWI</div>
      <div class="tagline">ONE TICK. INDEPENDENT VOICE.</div>
    </div>
  </div>
</body>
</html>
